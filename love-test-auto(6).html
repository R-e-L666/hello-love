<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>心动测试 · 那个人对你到底有没有动心</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg-dark:#0f0a1a;
  --card-bg:rgba(26, 16, 37, 0.65);
  --card-border:rgba(255,255,255,0.08);
  --pink:#ff6b9d;
  --purple:#a855f7;
  --text-main:#f0ebf8;
  --text-sub:#b4a8c9;
  --line:rgba(255,255,255,0.1);
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Helvetica Neue","Microsoft YaHei",sans-serif;
  background-color: var(--bg-dark);
  /* 浪漫星空背景底色 */
  background-image: 
    radial-gradient(circle at 15% 50%, rgba(168, 85, 247, 0.12) 0%, transparent 45%),
    radial-gradient(circle at 85% 30%, rgba(255, 107, 157, 0.12) 0%, transparent 45%);
  background-attachment: fixed;
  color:var(--text-main);
  min-height:100vh;padding:26px 18px 46px;
  display:flex;justify-content:center;-webkit-font-smoothing:antialiased;
  position: relative;
  overflow-x: hidden;
}

/* ================= 星空特效加强版 ================= */

/* 第一层：细碎的小星星，偏白，快速闪烁 */
body::before {
  content: "";
  position: fixed; top: 0; left: 0; width: 1.5px; height: 1.5px;
  border-radius: 50%; background: transparent;
  box-shadow: 
    10vw 10vh #fff, 20vw 30vh rgba(255,255,255,0.8), 80vw 15vh #fff, 
    90vw 60vh rgba(255,255,255,0.6), 30vw 80vh #fff, 70vw 90vh rgba(255,255,255,0.9),
    50vw 40vh rgba(255,255,255,0.4), 5vw 70vh #fff, 95vw 20vh #fff,
    45vw 15vh #fff, 12vw 45vh #fff, 88vw 35vh #fff, 62vw 85vh #fff,
    35vw 65vh #fff, 55vw 95vh #fff, 25vw 5vh #fff, 75vw 55vh #fff;
  animation: twinkle 3.5s infinite alternate;
  z-index: -2; pointer-events: none;
}

/* 第二层：偏大、带粉色和紫色的微光星，慢速闪烁 */
body::after {
  content: "";
  position: fixed; top: 0; left: 0; width: 2.5px; height: 2.5px;
  border-radius: 50%; background: transparent;
  box-shadow: 
    15vw 60vh #ffd5e5, 40vw 20vh #e0c3fc, 60vw 70vh #ffd5e5, 
    85vw 80vh #e0c3fc, 75vw 10vh #ffd5e5, 25vw 15vh #e0c3fc,
    55vw 30vh #fff, 30vw 40vh #cce5ff, 65vw 50vh #fff,
    5vw 85vh #ffd5e5, 95vw 45vh #e0c3fc, 48vw 75vh #fff;
  animation: twinkle 2.8s infinite alternate-reverse;
  animation-delay: 1.2s;
  z-index: -2; pointer-events: none;
}

/* 第三层：大光晕与十字星芒效果，呼吸闪烁 */
.app::before {
  content: ""; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background-image: 
    /* 大光晕 */
    radial-gradient(circle at 15% 20%, rgba(255,255,255,0.3) 0%, transparent 2%),
    radial-gradient(circle at 85% 15%, rgba(255,255,255,0.4) 0%, transparent 3%),
    radial-gradient(circle at 75% 75%, rgba(255,255,255,0.25) 0%, transparent 2%),
    radial-gradient(circle at 25% 85%, rgba(255,255,255,0.3) 0%, transparent 2%),
    radial-gradient(circle at 50% 40%, rgba(255,255,255,0.15) 0%, transparent 15%);
  animation: glowPulse 4s infinite alternate;
  z-index: -1; pointer-events: none;
}

/* 闪烁动画 */
@keyframes twinkle { 
  0% { opacity: 0.4; } 
  100% { opacity: 1; } 
}
/* 光晕呼吸动画 */
@keyframes glowPulse {
  0% { opacity: 0.5; transform: scale(0.98); }
  100% { opacity: 1; transform: scale(1.02); }
}

/* ================================================= */

.app{width:100%;max-width:420px;position:relative;z-index:1}
.screen{display:none}
.screen.active{display:block;animation:screenIn .4s cubic-bezier(.22,.61,.36,1)}
@keyframes screenIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}

/* 卡片：半透明毛玻璃 */
.card{
  background:var(--card-bg);
  border:1px solid var(--card-border);
  border-radius:26px;
  padding:30px 22px 26px;
  box-shadow:0 15px 35px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

/* 首页 */
.logo{
  width:72px;height:72px;margin:0 auto 22px;border-radius:24px;
  background:linear-gradient(135deg, rgba(255,107,157,0.2), rgba(168,85,247,0.2));
  border:1px solid rgba(255,255,255,0.15);
  display:flex;align-items:center;justify-content:center;
  color:var(--pink);
  box-shadow: 0 0 20px rgba(255,107,157,0.2);
}
.h1{font-size:22px;font-weight:700;text-align:center;letter-spacing:1px;margin-bottom:8px;color:#fff}
.h-sub{font-size:13.5px;color:var(--text-sub);text-align:center;line-height:1.7;margin-bottom:28px;letter-spacing:.3px}
.pwd-input{
  width:100%;height:58px;border-radius:18px;border:1.5px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.05);text-align:center;font-size:23px;font-weight:600;
  letter-spacing:9px;text-indent:9px;color:var(--pink);outline:none;
  font-family:inherit;transition:.22s;
}
.pwd-input::placeholder{font-size:14px;font-weight:400;letter-spacing:1px;text-indent:1px;color:#7a6a8f}
.pwd-input:focus{border-color:var(--pink);background:rgba(255,255,255,0.08);box-shadow:0 0 0 4px rgba(255,107,157,0.15)}
.err{height:20px;margin-top:12px;text-align:center;font-size:13px;color:var(--pink);opacity:0;transition:opacity .2s}
.err.show{opacity:1}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.shake{animation:shake .4s}

/* 按钮 */
.btn{
  width:100%;height:54px;border:0;border-radius:18px;
  background:linear-gradient(135deg,#ff6b9d,#a855f7);
  color:#fff;font-size:16px;font-weight:600;font-family:inherit;letter-spacing:1px;
  cursor:pointer;margin-top:18px;box-shadow:0 8px 24px rgba(255,107,157,0.3);
  transition:transform .15s,box-shadow .15s;
}
.btn:active{transform:scale(.98);box-shadow:0 4px 12px rgba(255,107,157,0.2)}
.btn:disabled{opacity:.7}
.btn.ghost{background:rgba(255,255,255,0.05);color:#fff;border:1.5px solid rgba(255,255,255,0.15);box-shadow:none}
.btn.ghost:active{background:rgba(255,255,255,0.1)}

/* 性别选择 */
.gender-list{display:flex;flex-direction:column;gap:14px;margin-top:4px}
.gender-item{
  display:flex;align-items:center;gap:16px;width:100%;padding:17px 20px;
  border-radius:20px;border:1.5px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);
  font-family:inherit;font-size:16.5px;font-weight:600;color:#dcd3e8;cursor:pointer;
  text-align:left;transition:.22s;
}
.gender-item:active{transform:scale(.985)}
.g-icon{
  flex:0 0 auto;width:46px;height:46px;border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.08);font-size:24px;line-height:1;transition:.22s;
}
.gender-item.on{
  border-color:rgba(255,107,157,0.6);background:linear-gradient(135deg, rgba(255,107,157,0.15), rgba(168,85,247,0.15));
  box-shadow:0 0 20px rgba(255,107,157,0.2);color:#fff;
}
.gender-item.on .g-icon{background:rgba(255,255,255,0.15)}

.intro-wrap{display:none}
.intro-wrap.show{display:block;animation:fadeUp .42s cubic-bezier(.22,.61,.36,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.intro{
  position:relative;margin-top:22px;padding:19px 20px 19px 24px;border-radius:18px;
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
  font-size:14.5px;line-height:1.95;color:var(--text-sub);letter-spacing:.2px;overflow:hidden;
}
.intro::before{
  content:"";position:absolute;left:0;top:22px;bottom:22px;width:3px;
  border-radius:0 3px 3px 0;background:linear-gradient(180deg,var(--pink),var(--purple));
}

/* 答题 */
.prog-label{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--text-sub);letter-spacing:.6px;margin-bottom:10px}
.prog-bar{height:6px;border-radius:99px;background:rgba(255,255,255,0.1);overflow:hidden;margin-bottom:26px}
.prog-bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--purple));transition:width .35s cubic-bezier(.22,.61,.36,1);box-shadow:0 0 10px rgba(255,107,157,0.5)}
.q-title{font-size:18.5px;font-weight:600;line-height:1.68;letter-spacing:.2px;color:#fff;margin-bottom:22px}
.q-fade{animation:qIn .3s ease}
@keyframes qIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.opts{display:flex;flex-direction:column;gap:12px}
.opt{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  padding:16px 18px;border-radius:16px;border:1.5px solid rgba(255,255,255,0.08);
  background:rgba(255,255,255,0.03);font-family:inherit;font-size:14.5px;line-height:1.55;
  color:#dcd3e8;cursor:pointer;transition:.18s;
}
.opt:active{background:rgba(255,255,255,0.08)}
.badge{
  flex:0 0 auto;width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.1);font-size:11.5px;font-weight:700;
  color:var(--text-sub);margin-top:1px;transition:.18s;
}
.opt.on{
  background:linear-gradient(135deg, rgba(255,107,157,0.9), rgba(168,85,247,0.9));
  border-color:transparent;color:#fff;
  box-shadow:0 6px 20px rgba(168,85,247,0.4);
}
.opt.on .badge{background:rgba(255,255,255,0.3);color:#fff}

.back-row{margin-top:24px;text-align:center}
.back-btn{background:none;border:0;font-family:inherit;font-size:13.5px;color:var(--text-sub);padding:8px 16px;cursor:pointer;transition:.18s}
.back-btn:active{color:#fff}
.back-btn:disabled{opacity:.3;cursor:default}

/* 结果页 */
.pct-hero{
  text-align:center;padding:24px 0 20px;margin:-6px -6px 0;border-radius:20px;
  background:radial-gradient(circle at 50% 30%, rgba(168,85,247,0.15) 0%, transparent 70%);
}
.pct-label{font-size:12.5px;color:var(--text-sub);letter-spacing:3px;margin-bottom:8px}
.pct{line-height:1;margin-bottom:16px}
.pct-num,.pct-sign{
  font-weight:800;
  background:linear-gradient(135deg, #ff9ec0, #ff6b9d 40%, #a855f7);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow: 0 0 30px rgba(255,107,157,0.3);
}
.pct-num{font-size:72px;letter-spacing:-2px}
.pct-sign{font-size:32px;margin-left:1px}

.tier-badge{
  display:inline-block;padding:8px 22px;border-radius:99px;
  font-size:14px;font-weight:600;color:#fff;letter-spacing:1px;
}
.tier-badge.t0{background:linear-gradient(135deg,#ff6b9d,#ff8fab);box-shadow:0 6px 20px rgba(255,107,157,0.4)}
.tier-badge.t1{background:linear-gradient(135deg,#a855f7,#c084fc);box-shadow:0 6px 20px rgba(168,85,247,0.4)}
.tier-badge.t2{background:linear-gradient(135deg,#6b7280,#9ca3af);box-shadow:0 6px 20px rgba(107,114,128,0.3)}
.tier-badge.t3{background:linear-gradient(135deg,#4b5563,#6b7280);box-shadow:0 6px 20px rgba(75,85,99,0.3)}

.tier{
  text-align:center;font-size:18px;font-weight:700;line-height:1.55;
  color:#fff;padding:18px 6px 6px;margin-bottom:6px;
}

.section-title{
  font-size:14px;font-weight:700;color:#fff;letter-spacing:1px;
  margin:26px 0 16px;padding-left:12px;position:relative;
}
.section-title::before{
  content:"";position:absolute;left:0;top:3px;bottom:3px;width:3px;border-radius:3px;
  background:linear-gradient(180deg,var(--pink),var(--purple));
}

/* 维度 */
.dims{display:flex;flex-direction:column;gap:18px}
.dim-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.dim-name{font-size:14px;font-weight:600;color:#dcd3e8}
.dim-val{font-size:14px;font-weight:700;color:var(--pink)}
.dim-bar{height:6px;border-radius:99px;background:rgba(255,255,255,0.1);overflow:hidden;margin-bottom:6px}
.dim-bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--purple),var(--pink));
  transition:width .8s cubic-bezier(.22,.61,.36,1);
  box-shadow:0 0 8px rgba(255,107,157,0.6);
}
.dim-desc{font-size:12px;color:#7a6a8f;letter-spacing:.2px}

/* 解读 */
.res-text{font-size:14.5px;line-height:1.95;color:#dcd3e8;letter-spacing:.2px}
.res-text p{margin-bottom:13px}
.res-text p:last-child{margin-bottom:0}

/* 建议 */
.advice-box{
  margin-top:24px;padding:20px;border-radius:18px;
  background:linear-gradient(135deg, rgba(255,107,157,0.1), rgba(168,85,247,0.1));border:1px solid rgba(255,107,157,0.2);
}
.advice-title{font-size:14px;font-weight:700;color:var(--pink);margin-bottom:10px;letter-spacing:.5px}
.advice-text{font-size:14px;line-height:1.9;color:#e0d6ec}

/* 温馨提示 */
.tip-card{
  margin-top:16px;padding:18px;border-radius:18px;
  background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);
}
.tip-title{font-size:13px;font-weight:700;color:#b4a8c9;margin-bottom:8px;letter-spacing:.5px}
.tip-text{font-size:13px;line-height:1.8;color:#8a7d9e}

.tiny{text-align:center;font-size:11.5px;color:#5d516d;letter-spacing:.4px;margin-top:22px}
</style>
</head>
<body>

<div class="app">

  <!-- ① 密码解锁 -->
  <section class="screen active" id="s-pwd">
    <div class="card" id="pwdCard">
      <div class="logo">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>
        </svg>
      </div>
      <h1 class="h1">心动测试</h1>
      <p class="h-sub">那个人对你到底有没有动心<br>请输入购买后获得的口令</p>
      <input class="pwd-input" id="pwdInput" type="tel" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="请输入 4 位数字口令">
      <div class="err" id="pwdErr">口令不正确，请核对后重试</div>
      <button class="btn" id="pwdBtn">解 锁 测 试</button>
    </div>
  </section>

  <!-- ② 性别选择 -->
  <section class="screen" id="s-gender">
    <div class="card">
      <h1 class="h1">先告诉我</h1>
      <p class="h-sub">你想测的那个人，是男生还是女生？</p>
      <div class="gender-list">
        <button class="gender-item" data-g="boy"><span class="g-icon">👦</span><span>Ta 是男生</span></button>
        <button class="gender-item" data-g="girl"><span class="g-icon">👧</span><span>Ta 是女生</span></button>
      </div>
      <div class="intro-wrap" id="introWrap">
        <div class="intro" id="introText"></div>
        <button class="btn" id="startBtn">开 始 测 试</button>
      </div>
    </div>
  </section>

  <!-- ③ 答题 -->
  <section class="screen" id="s-quiz">
    <div class="card">
      <div class="prog-label"><span id="progNum">第 1 / 38 题</span><span id="progPct">0%</span></div>
      <div class="prog-bar"><i id="progFill"></i></div>
      <div id="qBox">
        <h2 class="q-title" id="qTitle"></h2>
        <div class="opts" id="opts"></div>
      </div>
      <div class="back-row"><button class="back-btn" id="backBtn">← 返回上一题</button></div>
    </div>
  </section>

  <!-- ④ 结果 -->
  <section class="screen" id="s-result">
    <div class="card">
      <div class="pct-hero">
        <div class="pct-label">心 动 指 数</div>
        <div class="pct"><span class="pct-num" id="pctNum">0</span><span class="pct-sign">%</span></div>
        <div class="tier-badge t1" id="tierBadge">明显好感</div>
      </div>

      <div class="tier" id="tierName"></div>

      <div class="section-title">五维心动分析</div>
      <div class="dims" id="dimsBox"></div>

      <div class="section-title">详细解读</div>
      <div class="res-text" id="resText"></div>

      <div class="advice-box">
        <div class="advice-title">💌 给你的建议</div>
        <div class="advice-text" id="adviceText"></div>
      </div>

      <div class="tip-card">
        <div class="tip-title">💝 温馨提示</div>
        <div class="tip-text">心动是两个人的事，测试只是参考。无论结果如何，都请相信自己的感受，也尊重对方的节奏。爱情不是考试，没有标准答案。</div>
      </div>

      <button class="btn ghost" id="retryBtn">重 新 测 试</button>
      <div class="tiny">趣味测评，仅供娱乐参考。</div>
    </div>
  </section>

</div>

<script>
/* ============================================================
   一、口令配置
   ============================================================ */
const PASSWORDS = [ '3870' ];

/* ============================================================
   二、题库 —— Ta 是男生（38 题）
   ============================================================ */
const Q_BOY = [
{q:"在多人场合，他的目光会不自觉落在你的身上？",o:["经常对视，对视会躲闪或微笑","人群里会下意识留意你","偶尔扫到，不会停留很久","很少关注你"]},
{q:"主动发起聊天的人通常是谁？",o:["基本都是他主动找你","大部分时候他主动","你来我往，一半一半","几乎都是你主动，他很少开启话题"]},
{q:"他会不会主动或在聊天中提及自己的过往经历？",o:["主动跟你讲很多往事","你问到会愿意细说自己过往","只聊表面小事，很少提过去","回避聊自己的经历，闭口不谈"]},
{q:"集体活动的时候，他会下意识靠近你、站在你附近？",o:["主动靠近，站在你旁边","有机会就会靠近你","位置随机，不会特意靠近","刻意和你保持距离"]},
{q:"你们见面时，他对待你的态度，对比普通朋友是怎样的？",o:["明显更温柔特殊，和别人完全不一样","对你会更热情一点","对你和其他朋友差别不大","对你比普通朋友更冷淡客气"]},
{q:"当你约他单独见面，他的态度是？",o:["很开心，基本不会拒绝，还会期待下次","有空就愿意赴约","经常找理由推脱，有空才勉强答应","直接拒绝，尽量不和你单独出门"]},
{q:"他对你有没有暧昧的语言或动作？",o:["常有暧昧试探的话语、小动作","偶尔有一点点暧昧感","只有朋友间正常交流，无暧昧","刻意保持边界，杜绝暧昧"]},
{q:"在一群人面前，他会有照顾你的语言或动作吗？",o:["当众下意识照顾你，优先顾及你的感受","看到你需要时会出手照顾","只照顾所有人，不会单独关照你","很少顾及你的情况"]},

/* ============================================================
   六、逻辑
   ============================================================ */
const STORE_KEY = 'hm_unlock_v7';
const MIN_SCORE = 38;
const MAX_SCORE = 152;

const $ = id => document.getElementById(id);
const screens = { pwd:$('s-pwd'), gender:$('s-gender'), quiz:$('s-quiz'), result:$('s-result') };

let gender = null;
let questions = [];
let answers = [];
let current = 0;
let locked = false;

function showScreen(name){
  Object.keys(screens).forEach(k => screens[k].classList.toggle('active', k === name));
  window.scrollTo(0, 0);
}

function isUnlocked(){ try{ return localStorage.getItem(STORE_KEY)==='1'; }catch(e){ return false; } }
function markUnlocked(){ try{ localStorage.setItem(STORE_KEY,'1'); }catch(e){} }

/* ---------- 密码页 ---------- */
const pwdInput = $('pwdInput');
const pwdErr = $('pwdErr');
const pwdCard = $('pwdCard');

pwdInput.addEventListener('input', function(){
  this.value = this.value.replace(/\D/g,'').slice(0,4);
  pwdErr.classList.remove('show');
  if (this.value.length === 4) tryUnlock();
});
pwdInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
$('pwdBtn').addEventListener('click', tryUnlock);

function tryUnlock(){
  const val = pwdInput.value.trim();
  if (PASSWORDS.indexOf(val) !== -1) {
    markUnlocked();
    goGender();
  } else {
    pwdErr.classList.add('show');
    pwdCard.classList.remove('shake');
    void pwdCard.offsetWidth;
    pwdCard.classList.add('shake');
    if (navigator.vibrate) navigator.vibrate(30);
  }
}

/* ---------- 性别选择 ---------- */
const introWrap = $('introWrap');
const introText = $('introText');

document.querySelectorAll('.gender-item').forEach(function(btn){
  btn.addEventListener('click', function(){
    gender = this.dataset.g;
    document.querySelectorAll('.gender-item').forEach(b => b.classList.remove('on'));
    this.classList.add('on');
    introText.textContent = INTRO[gender];
    introWrap.classList.remove('show');
    void introWrap.offsetWidth;
    introWrap.classList.add('show');
  });
});

$('startBtn').addEventListener('click', function(){
  if (!gender) return;
  questions = (gender === 'boy' ? Q_BOY : Q_GIRL).slice();
  answers = new Array(questions.length).fill(-1);
  current = 0;
  showScreen('quiz');
  renderQuestion();
});

function goGender(){
  gender = null;
  document.querySelectorAll('.gender-item').forEach(b => b.classList.remove('on'));
  introWrap.classList.remove('show');
  introText.textContent = '';
  pwdInput.value = '';
  pwdErr.classList.remove('show');
  showScreen('gender');
}

/* ---------- 答题 ---------- */
const qTitle = $('qTitle');
const optsEl = $('opts');
const progFill = $('progFill');
const progNum = $('progNum');
const progPct = $('progPct');
const backBtn = $('backBtn');
const qBox = $('qBox');

function renderQuestion(){
  const q = questions[current];
  const ratio = current / questions.length;
  progFill.style.width = (ratio*100).toFixed(2) + '%';
  progNum.textContent = '第 ' + (current+1) + ' / ' + questions.length + ' 题';
  progPct.textContent = Math.round(ratio*100) + '%';

  qTitle.textContent = q.q;
  optsEl.innerHTML = '';
  q.o.forEach(function(text, i){
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'opt' + (answers[current] === i ? ' on' : '');
    btn.innerHTML = '<span class="badge">' + 'ABCD'[i] + '</span><span>' + text + '</span>';
    btn.addEventListener('click', function(){ choose(i); });
    optsEl.appendChild(btn);
  });

  backBtn.disabled = (current === 0);

  qBox.classList.remove('q-fade');
  void qBox.offsetWidth;
  qBox.classList.add('q-fade');
}

function choose(i){
  if (locked) return;
  locked = true;
  answers[current] = i;

  const btns = optsEl.querySelectorAll('.opt');
  btns.forEach((b, idx) => b.classList.toggle('on', idx === i));

  setTimeout(function(){
    locked = false;
    if (current < questions.length - 1) {
      current++;
      renderQuestion();
    } else {
      progFill.style.width = '100%';
      progPct.textContent = '100%';
      setTimeout(showResult, 200);
    }
  }, 260);
}

backBtn.addEventListener('click', function(){
  if (current > 0 && !locked) { current--; renderQuestion(); }
});

/* ---------- 结果 ---------- */
function calcScore(){
  return answers.reduce((sum, a) => sum + (4 - (a < 0 ? 3 : a)), 0);
}
function getTier(score){
  if (score >= 121) return 0;
  if (score >= 85) return 1;
  if (score >= 53) return 2;
  return 3;
}
function getPercent(score){
  const p = 10 + (score - MIN_SCORE) * 89 / (MAX_SCORE - MIN_SCORE);
  return Math.max(10, Math.min(99, Math.round(p)));
}

function calcDims(){
  return DIMS.map(function(d){
    let got = 0;
    d.qs.forEach(function(qn){
      const a = answers[qn - 1];
      if (a >= 0) got += (4 - a);
    });
    const full = d.qs.length * 4;
    return { name:d.name, emoji:d.emoji, desc:d.desc, pct: Math.round(got / full * 100) };
  });
}

function showResult(){
  const score = calcScore();
  const tierIdx = getTier(score);
  const percent = getPercent(score);
  const data = RESULTS[gender][tierIdx];

  const badge = $('tierBadge');
  badge.textContent = data.badge;
  badge.className = 'tier-badge ' + data.badgeClass;

  $('tierName').textContent = data.tier;

  const dims = calcDims();
  const dimsBox = $('dimsBox');
  dimsBox.innerHTML = '';
  dims.forEach(function(d, i){
    const div = document.createElement('div');
    div.className = 'dim';
    div.innerHTML =
      '<div class="dim-head"><span class="dim-name">' + d.emoji + ' ' + d.name + '</span>' +
      '<span class="dim-val">' + d.pct + '%</span></div>' +
      '<div class="dim-bar"><i></i></div>' +
      '<div class="dim-desc">' + d.desc + '</div>';
    dimsBox.appendChild(div);
    setTimeout(function(){
      div.querySelector('.dim-bar i').style.width = d.pct + '%';
    }, 120 + i * 100);
  });

  $('resText').innerHTML = data.text.split('\n').filter(p => p.trim()).map(p => '<p>' + p + '</p>').join('');
  $('adviceText').textContent = data.advice;

  showScreen('result');
  animateNumber($('pctNum'), percent);
}

function animateNumber(el, target){
  const duration = 720;
  let startTime = null;
  function step(t){
    if (!startTime) startTime = t;
    const p = Math.min((t - startTime) / duration, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(target * eased);
    if (p < 1) requestAnimationFrame(step);
    else el.textContent = target;
  }
  requestAnimationFrame(step);
}

$('retryBtn').addEventListener('click', function(){
  answers = []; current = 0; goGender();
});

/* ---------- 启动 ---------- */
(function init(){
  if (isUnlocked()) goGender();
  else showScreen('pwd');
})();
</script>
